services:
  # ═════════════════════════════════════════════════════════════════════════════
  # OPTION 1: ALL-IN-ONE FULL-STACK WEB SERVICE (RECOMMENDED)
  # Runs FastAPI + React Three.js SPA + WebSockets from a single URL.
  # Zero CORS configuration needed. Single Free-Tier container.
  # ═════════════════════════════════════════════════════════════════════════════
  - type: web
    name: astrocare-3d
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./astracare_dev.db
      - key: CORS_ORIGINS
        value: "*"
      - key: SIMULATION_INTERVAL_SECONDS
        value: "30"
      - key: PORT
        value: "10000"
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false

  # ═════════════════════════════════════════════════════════════════════════════
  # OPTION 2: STANDALONE BACKEND WEB SERVICE (If deploying separately)
  # ═════════════════════════════════════════════════════════════════════════════
  - type: web
    name: astrocare-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./astracare_dev.db
      - key: CORS_ORIGINS
        value: "https://astrocare-frontend.onrender.com,http://localhost:5173"
      - key: SIMULATION_INTERVAL_SECONDS
        value: "30"
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # ═════════════════════════════════════════════════════════════════════════════
  # OPTION 2: STANDALONE FRONTEND STATIC SITE (If deploying separately)
  # ═════════════════════════════════════════════════════════════════════════════
  - type: web
    name: astrocare-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://astrocare-backend.onrender.com
      - key: VITE_WS_URL
        value: wss://astrocare-backend.onrender.com
      - key: VITE_APP_NAME
        value: ASTROCARE 3D
      - key: VITE_APP_VERSION
        value: 1.0.0
